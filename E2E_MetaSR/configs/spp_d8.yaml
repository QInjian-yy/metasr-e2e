classification_encoder: spp
metasr:
  scale: 32
  lr_chunk_size: 256
  checkpoint_rdb: true
  rgb_range: 1
  rdn_blocks: 8
# SPP with D8, a 100-epoch cap and 15-epoch early-stopping patience.
lambda_sr: 0.1
sr_train_crop: 256
training:
  use_region_microbatch: false
  region_microbatch_size: 1
precision: bf16
lr: 1.0e-5
weight_decay: 1.0e-4
epochs: 100
early_stopping_patience: 15
seed: 1
