classification_encoder: spp
classification_head: linear
metasr:
  scale: 32
  lr_chunk_size: 256
  checkpoint_rdb: true
  rgb_range: 1
  rdn_blocks: 1
  freeze_meanshift: false
lambda_sr: 0.0
sr_train_crop: 256
training:
  use_region_microbatch: false
  region_microbatch_size: 1
precision: bf16
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 80
early_stopping_patience: 20
seed: 1
augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation90: true
