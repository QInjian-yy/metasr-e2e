classification_encoder: spp
metasr:
  scale: 32
  lr_chunk_size: 256
  checkpoint_rdb: true
  rgb_range: 1
  rdn_blocks: 16
# Same SR and training settings as baseline.yaml; only classification changes.
lambda_sr: 0.1
sr_train_crop: 256
training:
  use_region_microbatch: false
  region_microbatch_size: 1
precision: bf16
lr: 1.0e-5
weight_decay: 1.0e-4
epochs: 20
early_stopping_patience: 5
seed: 1
