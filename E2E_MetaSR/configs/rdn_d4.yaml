metasr:
  scale: 32
  lr_chunk_size: 256
  checkpoint_rdb: true
  rgb_range: 1
  rdn_blocks: 4
# RDN-B-D4 variant: G0=64, kernel=3, D=4, C=8, growth=64.
# Only RDN depth changes relative to rdn_d8.yaml.
lambda_sr: 0.1
sr_train_crop: 256
training:
  use_region_microbatch: false
  region_microbatch_size: 1
precision: bf16
lr: 1.0e-5
weight_decay: 1.0e-4
epochs: 20
early_stopping_patience: 5
seed: 1
